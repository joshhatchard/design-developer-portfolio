name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The visual/WebGL suite is intentionally manual: it is valuable before
      # a significant release, but unnecessarily slow for every small push.
      - if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright artifacts
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
