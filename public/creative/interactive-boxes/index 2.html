<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main id="stage" aria-label="Interactive geometric tile canvas"></main>
    <aside class="controls" aria-label="Interactive Boxes controls">
      <p>Controls</p>
      <ul>
        <li><kbd>Click</kbd><span>Split a tile</span></li>
        <li><kbd>Right-click</kbd><span>Merge tiles</span></li>
        <li><kbd>↑</kbd><kbd>↓</kbd><span>Rotate</span></li>
        <li><kbd>←</kbd><kbd>→</kbd><span>Change shape</span></li>
      </ul>
      <button type="button" id="reset" aria-label="Reset Interactive Boxes">Reset</button>
    </aside>
    <script src="sketch.js"></script>
  </body>
</html>
